<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUY LK — Set New Password</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-container {
        max-width: 460px;
        margin: 60px auto;
        padding: 40px;
        background: var(--surface);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }

      .auth-header h2 {
        font-size: 1.8rem;
        margin-bottom: 8px;
      }

      .auth-header p,
      .helper-text {
        color: var(--muted);
        line-height: 1.6;
      }

      .auth-form {
        display: grid;
        gap: 16px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      .form-group label {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .form-group input {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .auth-form button {
        padding: 14px 24px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 8px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .auth-footer {
        text-align: center;
        margin-top: 24px;
        color: var(--muted);
      }

      .auth-footer a,
      .helper-text a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }

      .error-message,
      .success-message {
        font-size: 0.9rem;
        padding: 10px 12px;
        border-radius: 10px;
        display: none;
      }

      .error-message {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }

      .success-message {
        color: #10b981;
        background: rgba(16, 185, 129, 0.1);
      }

      .show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">BL</span>
          <span class="brand-name">BUYLK</span>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>

      <div class="auth-container">
        <div class="auth-header">
          <h2>Set a new password</h2>
          <p>If you came here from the reset email, enter a new password below.</p>
        </div>

        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>

        <form class="auth-form" id="resetPasswordForm">
          <div class="form-group">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" placeholder="Enter new password" required minlength="6" />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required minlength="6" />
          </div>

          <button type="submit"><span>Update password</span></button>
        </form>

        <p class="helper-text" id="sessionHint" style="margin-top: 16px; text-align: center;">
          Waiting for your recovery session...
        </p>

        <div class="auth-footer">
          <a href="login.html">Back to sign in</a>
        </div>
      </div>
    </div>

    <script src="api.js?v=20260425"></script>
    <script>
      const form = document.getElementById("resetPasswordForm");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      const sessionHint = document.getElementById("sessionHint");
      let recoveryReady = false;

      const showError = (message) => {
        successMsg.classList.remove("show");
        errorMsg.textContent = message;
        errorMsg.classList.add("show");
      };

      const showSuccess = (message) => {
        errorMsg.classList.remove("show");
        successMsg.textContent = message;
        successMsg.classList.add("show");
      };

      const initializeRecoverySession = async () => {
        try {
          const supabase = await getSupabaseClient();

          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            recoveryReady = true;
            sessionHint.textContent = "Recovery session detected. You can set a new password now.";
            return;
          }

          sessionHint.textContent = "Open this page from the password reset email to continue.";
        } catch (error) {
          console.error("Recovery init error:", error);
          sessionHint.textContent = "Unable to verify reset session.";
        }
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!recoveryReady) {
          showError("No recovery session found. Please use the link from your email.");
          return;
        }

        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        if (password.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }

        if (password !== confirmPassword) {
          showError("Passwords do not match.");
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = "Updating...";
        submitBtn.disabled = true;

        try {
          const supabase = await getSupabaseClient();
          const { error } = await supabase.auth.updateUser({ password });

          if (error) {
            showError(error.message || "Unable to update password.");
            return;
          }

          showSuccess("Password updated successfully. Redirecting to sign in...");
          await supabase.auth.signOut();
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1800);
        } catch (error) {
          console.error("Reset password error:", error);
          showError("An error occurred. Please try again.");
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      });

      initializeRecoverySession();
    </script>
  </body>
</html>
