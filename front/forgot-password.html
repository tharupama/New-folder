<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUY LK — Forgot Password</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .auth-container {
        max-width: 460px;
        margin: 60px auto;
        padding: 40px;
        background: var(--surface);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }

      .auth-header h2 {
        font-size: 1.8rem;
        margin-bottom: 8px;
      }

      .auth-header p,
      .helper-text {
        color: var(--muted);
        line-height: 1.6;
      }

      .auth-form {
        display: grid;
        gap: 16px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      .form-group label {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .form-group input {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .auth-form button {
        padding: 14px 24px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 8px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .auth-footer {
        text-align: center;
        margin-top: 24px;
        color: var(--muted);
      }

      .auth-footer a,
      .helper-text a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }

      .error-message,
      .success-message {
        font-size: 0.9rem;
        padding: 10px 12px;
        border-radius: 10px;
        display: none;
      }

      .error-message {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }

      .success-message {
        color: #10b981;
        background: rgba(16, 185, 129, 0.1);
      }

      .show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">BL</span>
          <div>
            <h1>BUY LK</h1>
            <p>Fresh food delivered fast</p>
          </div>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>

      <div class="auth-container">
        <div class="auth-header">
          <h2>Reset your password</h2>
          <p>Enter your email and we’ll send you a secure reset link from Supabase.</p>
        </div>

        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>

        <form class="auth-form" id="forgotPasswordForm">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <button type="submit"><span>Send reset link</span></button>
        </form>

        <p class="helper-text" style="margin-top: 16px; text-align: center;">
          After clicking the email link, you will be taken to the password reset page.
        </p>

        <div class="auth-footer">
          Remember your password? <a href="login.html">Back to sign in</a>
        </div>
      </div>
    </div>

    <script src="api.js?v=20260425"></script>
    <script>
      const form = document.getElementById("forgotPasswordForm");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");

      const showError = (message) => {
        successMsg.classList.remove("show");
        errorMsg.textContent = message;
        errorMsg.classList.add("show");
      };

      const showSuccess = (message) => {
        errorMsg.classList.remove("show");
        successMsg.textContent = message;
        successMsg.classList.add("show");
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        if (!email || !email.includes("@")) {
          showError("Please enter a valid email address.");
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = "Sending...";
        submitBtn.disabled = true;

        try {
          const supabase = await getSupabaseClient();
          const redirectTo = new URL("reset-password.html", window.location.href).href;
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo,
          });

          if (error) {
            showError(error.message || "Unable to send reset link.");
            return;
          }

          showSuccess("Reset link sent. Check your inbox and spam folder.");
          form.reset();
        } catch (error) {
          console.error("Forgot password error:", error);
          showError("An error occurred. Please try again.");
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
