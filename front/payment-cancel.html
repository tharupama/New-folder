<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled - BUY LK</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(239, 68, 68, 0.14), transparent 42%),
          linear-gradient(180deg, rgba(15, 23, 42, 0.04), rgba(15, 23, 42, 0.01));
      }

      .cancel-shell {
        width: min(100%, 760px);
        padding: 24px;
      }

      .cancel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 44px;
        text-align: center;
      }

      .cancel-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: #fff;
        font-size: 2rem;
        margin-bottom: 20px;
      }

      .cancel-card h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-bottom: 12px;
      }

      .cancel-card p {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
        max-width: 58ch;
        margin: 0 auto 14px;
      }

      .cancel-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .cancel-actions a {
        text-decoration: none;
      }

      .secondary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 160px;
        padding: 14px 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text);
        background: transparent;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="cancel-shell">
      <section class="cancel-card">
        <div class="cancel-badge">!</div>
        <h1>Payment cancelled</h1>
        <p>
          Your checkout was not completed. The cart is still saved in your browser, so you can continue when you are ready.
        </p>
        <div class="cancel-actions">
          <a class="primary-btn" href="index.html">Return to cart</a>
          <a class="secondary-btn" href="shop.html">Keep shopping</a>
        </div>
      </section>
    </main>
  </body>
</html>
